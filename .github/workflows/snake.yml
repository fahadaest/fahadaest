name: Generate Snake Animation

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: output
          path: output

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@master
        with:
          github_user_name: fahadaest
          svg_out_path: output/github-contribution-grid-snake-dark.svg
          gif_out_path: output/github-contribution-grid-snake-dark.gif
          colors:
            - '00ff00'
            - '00cc00'
            - '009900'
            - '006600'
            - '003300'
